# Append this block to /etc/CODESYSControl_User.cfg on the Raspberry Pi that hosts
# the USB-to-RS232 adapter. First stop the runtime so it isn't holding the port
# while you edit (sudo systemctl stop codesyscontrol), then after saving:
#   sudo systemctl start codesyscontrol
#
# portnum.1=1 maps to "COM1" inside the CODESYS IDE's Modbus Serial Master device config.
# baudrate.1 locks the runtime-level baud rate so it can't silently drift from the
# confirmed setting -- see linux-integration/README.md Sec 4.1a for why this matters.

[SysCom]
Linux.Devicefile.1=/dev/ttyUSB0
portnum.1=1
baudrate.1=19200
